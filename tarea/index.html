<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de tareas de estudio</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; }
    input[type="text"] { flex: 1; min-width: 160px; padding: .4rem; }
    button { cursor: pointer; padding: .4rem .7rem; }
    #mensaje { min-height: 1.2rem; color: #b00020; margin: .4rem 0; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center;
         padding: .5rem; border-bottom: 1px solid #ddd; }
    li.completada span { text-decoration: line-through; color: #888; }
    li.alta { border-left: 4px solid #d32f2f; }
    li.media { border-left: 4px solid #f9a825; }
    li.baja { border-left: 4px solid #388e3c; }
    li span { cursor: pointer; flex: 1; }
  </style>
</head>
<body>
  <h1>Tareas de estudio</h1>

  <form id="formulario">
    <input type="text" id="texto" placeholder="Nueva tarea">
    <select id="prioridad">
      <option value="alta">Alta</option>
      <option value="media" selected>Media</option>
      <option value="baja">Baja</option>
    </select>
    <button type="submit">Agregar</button>
  </form>
  <p id="mensaje"></p>

  <input type="text" id="buscador" placeholder="Buscar tarea...">
  <ul id="lista"></ul>
  <p id="contador"></p>

  <script src="app.js"></script>
</body>
</html>
